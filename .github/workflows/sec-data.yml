name: sec-data

# Daily refresh of the SEC EDGAR XBRL data that the portfolio-screener Apps Script reads.
# (SEC blocks Google Apps Script with HTTP 403, so this job fetches it instead.)
on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sec-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: node --test scripts/fetch_sec.test.mjs

      - name: Fetch SEC data
        env:
          # Contact email for SEC's required User-Agent. Stored only as a repository
          # secret (gh secret set SEC_CONTACT_EMAIL); never written to any file or log.
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/fetch_sec.mjs

      # Runs even if the fetch exited non-zero, so meta.json (with the failure reasons)
      # is published; per-ticker files are only ever written on success.
      - name: Commit changes (only if data/ changed)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update SEC data"
            git push
          fi
