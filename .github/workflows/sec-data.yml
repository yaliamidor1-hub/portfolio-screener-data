name: sec-data

# Daily refresh of the SEC EDGAR XBRL data that the portfolio-screener Apps Script reads.
# (SEC blocks Google Apps Script with HTTP 403, so this job fetches it instead.)
on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sec-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: node --test scripts/fetch_sec.test.mjs scripts/fetch_filings.test.mjs scripts/sync_tickers.test.mjs scripts/commit_data.test.mjs scripts/build_facts.test.mjs scripts/fetch_releases.test.mjs scripts/make_il_prices.test.mjs

      # The Apps Script `Universe` tab is the source of truth for tickers.txt (market=US rows only; IL rows are
      # never fetched from the SEC). If the call fails, tickers.txt stays as it is and a warning is logged.
      - name: Sync tickers.txt from the Universe tab
        continue-on-error: true
        env:
          TICKERS_URL: ${{ secrets.SCREENER_WEBAPP_URL }}
          TICKERS_TOKEN: ${{ secrets.TICKERS_TOKEN }}
        run: node scripts/sync_tickers.mjs

      - name: Fetch SEC data
        env:
          # Contact email for SEC's required User-Agent. Stored only as a repository
          # secret (gh secret set SEC_CONTACT_EMAIL); never written to any file or log.
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/fetch_sec.mjs

      # Multi-year facts (revenue, profit, cash flow, debt, margins) computed offline from the XBRL bundles above:
      # data/facts/<TICKER>.json. No network, no secrets; a failure here never blocks the commit.
      - name: Build multi-year facts
        if: always()
        continue-on-error: true
        run: node scripts/build_facts.mjs

      # Latest 10-K / 20-F text sections for Stage 2. One submissions call per ticker per day;
      # the document is downloaded only when the accession changed. Runs even if the step
      # above failed (it reuses the CIKs from existing data/<TICKER>.json files).
      - name: Fetch latest annual filings (Stage 2 text)
        if: always()
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/fetch_filings.mjs

      # Earnings-release text (8-K Item 2.02, exhibit 99) so the Apps Script verification can check numbers quoted from them.
      - name: Fetch latest earnings releases
        if: always()
        continue-on-error: true
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/fetch_releases.mjs

      # Runs even if the fetch exited non-zero, so meta.json (with the failure reasons)
      # is published; per-ticker files are only ever written on success.
      # scripts/commit_data.sh: pull --rebase -X theirs (this run's data wins) up to 3 times, then fetch + reset to
      # origin/main and re-apply this run's files on top. Never --force. (Runs never overlap: see 'concurrency' above.)
      - name: Commit changes (only if data/ or tickers.txt changed)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/commit_data.sh
